# themes/tmux.conf
# Tesseract Neon status bar.
#   source-file ~/.config/tmux/tesseract-neon.conf
#
# Bar rule: cyan is structure (frame, prefix, clock, dividers), phosphor
# green is only the active window — the one that has your keyboard. Since
# only one window is active per screen, #55FFA6 appears once and never again.

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0C1315,fg=#6C8076"

# No rounded corner, no powerline: separation is space, not glyph.
set -g status-left-length 40
set -g status-right-length 60

# Session name: structure, cyan.
set -g status-left "#[fg=#030507,bg=#128C86,bold] ⧉ #S #[fg=#128C86,bg=#0C1315,nobold] "

# Prefix armed switches the badge background to blocking orange — it's the
# only moment the bar asks for your hand.
set -g status-left "#{?client_prefix,#[fg=#030507]#[bg=#FFB454]#[bold] ⧉ #S #[fg=#FFB454]#[bg=#0C1315]#[nobold] ,#[fg=#030507]#[bg=#128C86]#[bold] ⧉ #S #[fg=#128C86]#[bg=#0C1315]#[nobold] }"

# Inactive windows: dimmed, no hue.
setw -g window-status-format "#[fg=#6C8076,bg=#0C1315] #I #W#{?window_zoomed_flag, ▓,} "
setw -g window-status-separator ""

# Active window: here, and only here, the phosphor green.
setw -g window-status-current-format "#[fg=#030507,bg=#55FFA6,bold] #I #W#{?window_zoomed_flag, ▓,} "

# Activity and bell warning: neither green nor cyan.
setw -g window-status-activity-style "fg=#7DB7E8,bg=#0C1315"
setw -g window-status-bell-style "fg=#030507,bg=#FF3B47,bold"

set -g status-right "#[fg=#3E534E]#{?window_zoomed_flag,▓ ZOOM  ,}#[fg=#128C86]%H:%M #[fg=#3E534E]%d/%m "

# Grid: dimmed divider, active pane in the deep green of the focused grid.
set -g pane-border-style "fg=#16282A"
set -g pane-active-border-style "fg=#205047"
set -g pane-border-lines single
set -g pane-border-status off

# Messages and command prompt: blocking orange, solid inverted bar.
set -g message-style "bg=#FFB454,fg=#030507,bold"
set -g message-command-style "bg=#121C1F,fg=#E8F4EC"

# Copy mode: selection with the same raised background as the grid.
set -g mode-style "bg=#121C1F,fg=#E8F4EC"

set -g display-panes-active-colour "#22E0D0"
set -g display-panes-colour "#3E534E"
set -g clock-mode-colour "#22E0D0"
set -g clock-mode-style 24

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
