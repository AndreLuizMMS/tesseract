# themes/tmux.conf
# Barra de status do Tesseract Neon.
#   source-file ~/.config/tmux/tesseract-neon.conf
#
# Regra da barra: ciano é a estrutura (moldura, prefixo, relógio, divisórias),
# verde phosphor é só a janela ativa — a que tem o seu teclado. Como só existe
# uma janela ativa por tela, o #55FFA6 aparece uma vez e nunca mais.

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0C1315,fg=#6C8076"

# Sem canto arredondado, sem powerline: separação é espaço, não glifo.
set -g status-left-length 40
set -g status-right-length 60

# Nome da sessão: estrutura, ciano.
set -g status-left "#[fg=#030507,bg=#128C86,bold] ⧉ #S #[fg=#128C86,bg=#0C1315,nobold] "

# Prefixo armado troca o fundo do selo para laranja de bloqueio — é o único
# momento em que a barra pede a sua mão.
set -g status-left "#{?client_prefix,#[fg=#030507]#[bg=#FFB454]#[bold] ⧉ #S #[fg=#FFB454]#[bg=#0C1315]#[nobold] ,#[fg=#030507]#[bg=#128C86]#[bold] ⧉ #S #[fg=#128C86]#[bg=#0C1315]#[nobold] }"

# Janelas inativas: apagadas, sem matiz.
setw -g window-status-format "#[fg=#6C8076,bg=#0C1315] #I #W#{?window_zoomed_flag, ▓,} "
setw -g window-status-separator ""

# Janela ativa: aqui, e só aqui, o verde phosphor.
setw -g window-status-current-format "#[fg=#030507,bg=#55FFA6,bold] #I #W#{?window_zoomed_flag, ▓,} "

# Aviso de atividade e de sino: nem verde, nem ciano.
setw -g window-status-activity-style "fg=#7DB7E8,bg=#0C1315"
setw -g window-status-bell-style "fg=#030507,bg=#FF3B47,bold"

set -g status-right "#[fg=#3E534E]#{?window_zoomed_flag,▓ ZOOM  ,}#[fg=#128C86]%H:%M #[fg=#3E534E]%d/%m "

# Grade: divisória apagada, painel ativo no verde profundo da grade focada.
set -g pane-border-style "fg=#16282A"
set -g pane-active-border-style "fg=#205047"
set -g pane-border-lines single
set -g pane-border-status off

# Mensagens e prompt de comando: laranja de bloqueio, barra sólida invertida.
set -g message-style "bg=#FFB454,fg=#030507,bold"
set -g message-command-style "bg=#121C1F,fg=#E8F4EC"

# Modo cópia: seleção com o mesmo fundo elevado da grade.
set -g mode-style "bg=#121C1F,fg=#E8F4EC"

set -g display-panes-active-colour "#22E0D0"
set -g display-panes-colour "#3E534E"
set -g clock-mode-colour "#22E0D0"
set -g clock-mode-style 24

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
