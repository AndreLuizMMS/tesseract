# themes/wezterm.toml
# Save to ~/.config/wezterm/colors/tesseract-neon.toml and use:
#   config.color_scheme = "Tesseract Neon"

[metadata]
name = "Tesseract Neon"
author = "Tesseract"
origin_url = "https://github.com/andreluiz/tesseract"

[colors]
background = "#070B0C"
foreground = "#BFD1C6"

cursor_bg = "#55FFA6"
cursor_fg = "#030507"
cursor_border = "#55FFA6"

selection_bg = "#121C1F"
selection_fg = "#E8F4EC"

# Split divider: structure, therefore cyan.
split = "#128C86"

# Dimming of the inactive pane. No color: the unfocused grid dims, doesn't
# change hue. (Conservative decision — the palette defines no inactive pane color.)
scrollbar_thumb = "#16282A"

ansi = [
  "#070B0C", # 0  black
  "#C22F38", # 1  red
  "#1F7A4C", # 2  green   — brand.core
  "#C9A227", # 3  yellow
  "#3E7FA8", # 4  blue
  "#8B4FC4", # 5  magenta
  "#128C86", # 6  cyan    — flux.core
  "#BFD1C6", # 7  white
]

brights = [
  "#3E534E", # 8  bright black
  "#FF3B47", # 9  bright red
  "#55FFA6", # 10 bright green  — brand.phosphor
  "#FFB454", # 11 bright yellow
  "#7DB7E8", # 12 bright blue
  "#C77DFF", # 13 bright magenta
  "#22E0D0", # 14 bright cyan   — flux
  "#E8F4EC", # 15 bright white
]

[colors.tab_bar]
background = "#070B0C"

[colors.tab_bar.active_tab]
bg_color = "#121C1F"
fg_color = "#E8F4EC"

[colors.tab_bar.inactive_tab]
bg_color = "#0C1315"
fg_color = "#6C8076"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#121C1F"
fg_color = "#BFD1C6"

[colors.tab_bar.new_tab]
bg_color = "#070B0C"
fg_color = "#3E534E"

[colors.tab_bar.new_tab_hover]
bg_color = "#0C1315"
fg_color = "#128C86"
