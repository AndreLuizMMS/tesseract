# themes/wezterm.toml
# Salve em ~/.config/wezterm/colors/tesseract-neon.toml e use:
#   config.color_scheme = "Tesseract Neon"

[metadata]
name = "Tesseract Neon"
author = "Tesseract"
origin_url = "https://github.com/andreluiz/tesseract"

[colors]
background = "#070B0C"
foreground = "#BFD1C6"

cursor_bg = "#55FFA6"
cursor_fg = "#030507"
cursor_border = "#55FFA6"

selection_bg = "#121C1F"
selection_fg = "#E8F4EC"

# Divisória entre panes: estrutura, portanto ciano.
split = "#128C86"

# Escurecimento do pane inativo. Sem cor: a grade não focada apaga, não muda
# de matiz. (Decisão conservadora — a paleta não define cor de pane inativo.)
scrollbar_thumb = "#16282A"

ansi = [
  "#070B0C", # 0  preto
  "#C22F38", # 1  vermelho
  "#1F7A4C", # 2  verde   — brand.core
  "#C9A227", # 3  amarelo
  "#3E7FA8", # 4  azul
  "#8B4FC4", # 5  magenta
  "#128C86", # 6  ciano   — flux.core
  "#BFD1C6", # 7  branco
]

brights = [
  "#3E534E", # 8  preto brilhante
  "#FF3B47", # 9  vermelho brilhante
  "#55FFA6", # 10 verde brilhante  — brand.phosphor
  "#FFB454", # 11 amarelo brilhante
  "#7DB7E8", # 12 azul brilhante
  "#C77DFF", # 13 magenta brilhante
  "#22E0D0", # 14 ciano brilhante  — flux
  "#E8F4EC", # 15 branco brilhante
]

[colors.tab_bar]
background = "#070B0C"

[colors.tab_bar.active_tab]
bg_color = "#121C1F"
fg_color = "#E8F4EC"

[colors.tab_bar.inactive_tab]
bg_color = "#0C1315"
fg_color = "#6C8076"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#121C1F"
fg_color = "#BFD1C6"

[colors.tab_bar.new_tab]
bg_color = "#070B0C"
fg_color = "#3E534E"

[colors.tab_bar.new_tab_hover]
bg_color = "#0C1315"
fg_color = "#128C86"
