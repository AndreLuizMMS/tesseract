<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Tesseract — the mosaic never falls apart">
  <!--
    themes/logo-hero.svg
    The banner mark at the top of the README, reproducing the identity's
    hero: the two duotone squares and the wordmark with chromatic
    aberration — phosphor green shifted to one side, flux cyan to the
    other, both behind the white.

    Aberration is a BRAND SURFACE effect, and that's why it can exist here
    and can't exist inside the terminal. Even here there's no glow, shadow,
    gradient, or border radius: the offset is geometric, 2 units — enough
    to fringe the letter, little enough not to blur it.

    The panel carries its own #070B0C background, so the mark reads the
    same on GitHub's light and dark theme without needing two versions.
    It's the answer to "light green on white doesn't read": there's no
    white behind it.

    The font stack is monospace with a generic fallback, and the wordmark
    has a locked textLength — with none of them installed, the block's
    width stays the same and the composition doesn't fall apart.
  -->
  <title>Tesseract</title>

  <rect width="720" height="200" fill="#070B0C"/>

  <!-- the symbol: back square in flux, front one in phosphor -->
  <g transform="translate(56,32)">
    <rect x="28" y="28" width="100" height="100"
          fill="none" stroke="#22E0D0" stroke-width="8" stroke-linejoin="miter"/>
    <rect x="4" y="4" width="100" height="100"
          fill="none" stroke="#55FFA6" stroke-width="8" stroke-linejoin="miter"/>
    <rect x="57" y="57" width="18" height="18" fill="#E8F4EC"/>
  </g>

  <!-- wordmark: the two fringes first, the white on top -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
     font-size="40" font-weight="700" letter-spacing="10">
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#55FFA6" opacity="0.5" transform="translate(-2,0)">TESSERACT</text>
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#22E0D0" opacity="0.5" transform="translate(2,0)">TESSERACT</text>
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#E8F4EC">TESSERACT</text>
  </g>

  <text x="252" y="124"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="15" letter-spacing="1.6" fill="#22E0D0">the mosaic never falls apart</text>

  <text x="252" y="152"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="13" letter-spacing="1.2" fill="#3E534E">ts 0.1.0 // MIT</text>
</svg>
