<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Tesseract — o mosaico não desmonta">
  <!--
    themes/logo-hero.svg
    A marca de topo do README, reproduzindo o hero da identidade: os dois
    quadrados em duotone e o wordmark com aberração cromática — verde phosphor
    deslocado para um lado, ciano flux para o outro, os dois por trás do
    branco.

    Aberração é efeito de SUPERFÍCIE DE MARCA, e por isso pode existir aqui e
    não pode existir dentro do terminal. Mesmo aqui não há brilho, sombra,
    gradiente nem raio de borda: o deslocamento é geométrico, de 2 unidades —
    o suficiente para franjar a letra, pouco o bastante para não borrar.

    O painel traz o próprio fundo #070B0C, então a marca lê igual no tema
    claro e no escuro do GitHub sem precisar de duas versões. É a resposta ao
    "verde claro em branco não lê": não existe branco atrás.

    A pilha de fontes é monoespaçada com fallback genérico, e o wordmark tem
    textLength travado — sem nenhuma delas instalada, a largura do bloco
    continua a mesma e a composição não desanda.
  -->
  <title>Tesseract</title>

  <rect width="720" height="200" fill="#070B0C"/>

  <!-- o símbolo: quadrado de trás em flux, o da frente em phosphor -->
  <g transform="translate(56,32)">
    <rect x="28" y="28" width="100" height="100"
          fill="none" stroke="#22E0D0" stroke-width="8" stroke-linejoin="miter"/>
    <rect x="4" y="4" width="100" height="100"
          fill="none" stroke="#55FFA6" stroke-width="8" stroke-linejoin="miter"/>
    <rect x="57" y="57" width="18" height="18" fill="#E8F4EC"/>
  </g>

  <!-- wordmark: as duas franjas primeiro, o branco por cima -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
     font-size="40" font-weight="700" letter-spacing="10">
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#55FFA6" opacity="0.5" transform="translate(-2,0)">TESSERACT</text>
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#22E0D0" opacity="0.5" transform="translate(2,0)">TESSERACT</text>
    <text x="250" y="90" textLength="404" lengthAdjust="spacingAndGlyphs"
          fill="#E8F4EC">TESSERACT</text>
  </g>

  <text x="252" y="124"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="15" letter-spacing="1.6" fill="#22E0D0">o mosaico não desmonta</text>

  <text x="252" y="152"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="13" letter-spacing="1.2" fill="#3E534E">ts 0.1.0 // MIT</text>
</svg>
