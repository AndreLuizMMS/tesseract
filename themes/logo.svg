<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136" width="136" height="136" role="img" aria-label="Tesseract">
  <!--
    themes/logo.svg
    Two 100x100 squares, stroke 8, the back one offset +24/+24.
    No gradient, no shadow, no border radius, no glow.
    Square corners: stroke-linejoin="miter".

    Decision on record: the 18x18 tessera sits at the whole mark's geometric
    center (66,66) — the midpoint between the front square's center (54,54)
    and the back square's (78,78). It's the same spot as the ▓ in the
    character version: inside the area where the two squares overlap.

    Note: in the character version the front square is brand.core (#1F7A4C)
    and the ▓ is the phosphor. In the vector the order flips — front square in
    phosphor (#55FFA6) and tessera in fg.bright (#E8F4EC) — because at the
    thin 8-unit stroke the dark green disappears against a dark background.
  -->
  <title>Tesseract</title>

  <!-- back square: the second dimension -->
  <rect x="28" y="28" width="100" height="100"
        fill="none" stroke="#22E0D0" stroke-width="8" stroke-linejoin="miter"/>

  <!-- front square -->
  <rect x="4" y="4" width="100" height="100"
        fill="none" stroke="#55FFA6" stroke-width="8" stroke-linejoin="miter"/>

  <!-- lit tessera -->
  <rect x="57" y="57" width="18" height="18" fill="#E8F4EC"/>
</svg>
