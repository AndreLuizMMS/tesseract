# themes/kitty.conf
# vim:ft=kitty
## name: Tesseract Neon
## author: Tesseract
## license: MIT
## blurb: green is keyboard ownership, cyan is structure, state is never either one.
#
# Include in kitty.conf:
#   include ./tesseract-neon.conf

background            #070B0C
foreground            #BFD1C6

cursor                #55FFA6
cursor_text_color     #030507
# Solid cursor: no blink, no trail. That effect doesn't exist inside the terminal.
cursor_shape          block
cursor_blink_interval 0

selection_background  #121C1F
selection_foreground  #E8F4EC

url_color             #22E0D0

# Window borders: structure in cyan, active window in strong cyan.
active_border_color   #128C86
inactive_border_color #16282A
bell_border_color     #FFB454

# Tab bar: only the active tab lights up, and it lights up white — phosphor
# green is reserved for the cursor, which owns the keyboard.
tab_bar_background       #070B0C
active_tab_background    #121C1F
active_tab_foreground    #E8F4EC
active_tab_font_style    bold
inactive_tab_background  #0C1315
inactive_tab_foreground  #6C8076
inactive_tab_font_style  normal

mark1_foreground #030507
mark1_background #55FFA6
mark2_foreground #030507
mark2_background #22E0D0
mark3_foreground #030507
mark3_background #FFB454

# No ligatures, ever.
disable_ligatures always

# ANSI 16
color0  #070B0C
color8  #3E534E
color1  #C22F38
color9  #FF3B47
color2  #1F7A4C
color10 #55FFA6
color3  #C9A227
color11 #FFB454
color4  #3E7FA8
color12 #7DB7E8
color5  #8B4FC4
color13 #C77DFF
color6  #128C86
color14 #22E0D0
color7  #BFD1C6
color15 #E8F4EC
