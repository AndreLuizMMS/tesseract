<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 140 140" width="136" height="136" role="img" aria-label="Tesseract">
  <!--
    themes/logo-mono.svg
    Single-stroke version for favicon and 16px: same geometry as logo.svg,
    stroke 11, single currentColor color, WITHOUT the tessera — at 16px the
    little square in the middle turns into noise.

    Decision on record: the 11 stroke is thicker than the colored logo's 8
    and overflows 1.5 units outside the 0 0 136 136 frame. The rectangles'
    geometry was kept identical and the viewBox gained 2 units of slack on
    each side ("-2 -2 140 140") — changing the rectangles would change the
    mark, changing the viewBox wouldn't.
  -->
  <title>Tesseract</title>

  <rect x="28" y="28" width="100" height="100"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="miter"/>

  <rect x="4" y="4" width="100" height="100"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="miter"/>
</svg>
