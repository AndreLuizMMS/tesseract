<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 140 140" width="136" height="136" role="img" aria-label="Tesseract">
  <!--
    themes/logo-mono.svg
    Versão de traço único para favicon e 16px: mesma geometria da logo.svg,
    traço 11, cor única currentColor, SEM a tessera — a 16px o quadradinho
    do meio vira sujeira.

    Decisão registrada: o traço 11 é mais grosso que o 8 da logo colorida e
    transborda 1,5 unidade fora do quadro 0 0 136 136. A geometria dos
    retângulos foi mantida idêntica e o viewBox ganhou 2 unidades de folga em
    cada lado ("-2 -2 140 140") — mexer nos retângulos mudaria a marca, mexer
    no viewBox não.
  -->
  <title>Tesseract</title>

  <rect x="28" y="28" width="100" height="100"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="miter"/>

  <rect x="4" y="4" width="100" height="100"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="miter"/>
</svg>
